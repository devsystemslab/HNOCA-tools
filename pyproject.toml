[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "hnoca"
description = "Human Neural Organoid Cell Atlas Toolbox"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Jonas Simon Fleck", email = "jonas_simon.fleck@roche.com" },
  { name = "Zhisong He", email = "zhisong.he@bsse.ethz.ch" },
  { name = "Leander Dony", email = "leander.dony@helmholtz-munich.de" },
]
authors = [
  { name = "Jonas Simon Fleck" },
  { name = "Zhisong He" },
  { name = "Leander Dony" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.10",
  "cloudpickle>=3",
  "jax>=0.4",
  "jaxlib>=0.4",
  "joblib>=1.4",
  "matplotlib>=3.10",
  "numba>=0.58",
  "numpy>=1.26.4",
  "pandas>=2",
  "scanpy>=1.11",
  "scikit-learn>=1.1.3",
  "scipy>=1.15",
  # for debug logging (referenced from the issue template)
  "session-info2",
  "statsmodels>=0.14.2",
]
optional-dependencies.mapping = [
  "scarches>=0.6.1",
  "scvi-tools>=1.2",
]
optional-dependencies.stats = [
  "decoupler>=1.6",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://devsystemslab.github.io/HNOCA-tools/"
urls.Homepage = "https://github.com/devsystemslab/HNOCA-tools"
urls.Source = "https://github.com/devsystemslab/HNOCA-tools"

[dependency-groups]
dev = [
  "prek",
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "igraph>=0.11",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
  "pyyaml",
  "rich",
]
doc = [
  "mkdocs-macros-plugin",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mknotebooks",
  "pymdown-extensions",
]

[tool.hatch]
version.source = "vcs"
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "mkdocs build {args}"
envs.docs.scripts.clean = "rm -rf docs/*"
envs.docs.scripts.serve = "mkdocs serve {args}"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.10", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
max_supported_python = "3.14"  # keep classifiers in line with the hatch-test matrix

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "hnoca" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
